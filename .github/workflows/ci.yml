name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Critical only for now: zod 3 (contact backend) has a high advisory whose fix is a
      # major upgrade. Raise this to `high` once zod is upgraded.
      - run: npm audit --omit=dev --audit-level=critical
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      # The Turnstile test keys and the rest of the e2e environment live in playwright.config.ts (webServer.env).
      - run: npm run test:e2e
