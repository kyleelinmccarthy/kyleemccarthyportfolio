  const sup = grp(box(.6, .05, .18, P.yellow, 0, .025, 0), cyl(.07, .07, .34, P.teal, 0, .22, 0, 8), ball(.09, '#FFD9B8', 0, .47, 0), box(.03, .6, .03, P.wood, .14, .3, .05)); sup.scale.setScalar(S * .9); scene.add(sup);
  const M = new THREE.Matrix4(), fw = new V3(), up = new V3();
  tick.push(t => { const th = t * .12; up.copy(H.dir).multiplyScalar(Math.cos(rho)).addScaledVector(e1, Math.sin(rho) * Math.cos(th)).addScaledVector(e2, Math.sin(rho) * Math.sin(th)).normalize();
    fw.copy(e1).multiplyScalar(-Math.sin(th)).addScaledVector(e2, Math.cos(th)); fw.addScaledVector(up, -fw.dot(up)).normalize();
    sup.position.copy(up).multiplyScalar(1.004 + Math.sin(t * 2) * .0015); sup.quaternion.setFromRotationMatrix(M.makeBasis(fw, up, new V3().crossVectors(fw, up))); });
}

/* ───────────────────────── camera, modes ───────────────────────── */
const controls = new OrbitControls(camera, canvas);
Object.assign(controls, { enablePan: false, enableDamping: true, dampingFactor: .08, rotateSpeed: .55, zoomSpeed: .7, autoRotate: true, autoRotateSpeed: .55, minDistance: 2.1, maxDistance: 7 });
let W = 1, Hh = 1, overview = 4.5, mode = 'orbit', fly = null, focus = null, lastTouch = -1e9, viewOff = 0, viewOffTarget = 0;
const tmpCam = new THREE.PerspectiveCamera();
function resize() { W = innerWidth; Hh = innerHeight; renderer.setSize(W, Hh, false); composer.setSize(W, Hh); renderer.getDrawingBufferSize(skyU.uRes.value); camera.aspect = W / Hh; overview = Math.max(4.5, 4.1 / Math.min(1.25, camera.aspect)); controls.maxDistance = overview + 2.5; applyOffset(); }
function applyOffset() { camera.setViewOffset(W, Hh, viewOff, 0, W, Hh); camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
camera.position.copy(dirOf(8, -6)).multiplyScalar(overview); camera.lookAt(0, 0, 0);
controls.addEventListener('start', () => { controls.autoRotate = false; lastTouch = performance.now(); document.getElementById('hint').style.opacity = 0; });

const orbitPose = (dir, dist) => { const d = dir.clone(); d.y = clamp(d.y, -.9, .9); d.normalize().multiplyScalar(dist); tmpCam.position.copy(d); tmpCam.up.set(0, 1, 0); tmpCam.lookAt(0, 0, 0); return { pos: d, quat: tmpCam.quaternion.clone() }; };
function focusPose(p, az) { const f = p.south.clone().applyAxisAngle(p.up, az); const hh = p.h * S; const pos = p.pos.clone().addScaledVector(p.up, .26 + hh * .8).addScaledVector(f, .5 + hh * 2.2); tmpCam.position.copy(pos); tmpCam.up.copy(p.up); tmpCam.lookAt(p.pos.clone().addScaledVector(p.up, p.h * S * .55)); return { pos, quat: tmpCam.quaternion.clone() }; }

const qd = new THREE.Quaternion(), qi = new THREE.Quaternion();

  fly.t = Math.min(1, fly.t + dt / fly.dur); const k = ease(fly.t);
  const d0 = fly.p0.clone().normalize(), d1 = fly.pos.clone().normalize(), r0 = fly.p0.length(), r1 = fly.pos.length(), ang = d0.angleTo(d1);
  qd.setFromUnitVectors(d0, d1); qi.identity().slerp(qd, k);
  const r = lerp(r0, r1, k) + Math.sin(Math.PI * k) * Math.max(0, 1.7 + ang * .55 - (r0 + r1) / 2);
  camera.position.copy(d0.applyQuaternion(qi)).multiplyScalar(r); camera.quaternion.slerpQuaternions(fly.q0, fly.quat, k);

}

let cur = -1;
function open(id) {
  const p = LM[id]; cur = order.indexOf(id); fillPanel(p); document.body.classList.add('focus'); panel.classList.add('on'); tour.classList.add('on'); indexEl.classList.remove('on');
  viewOffTarget = W > 820 ? 215 : 0; const far = focus ? focus.p.dir.angleTo(p.dir) : 1;
  flyTo(focusPose(p, 0), focus ? 1.1 + far * .5 : 1.7, () => { mode = 'focus'; focus = { p, az: 0 }; camera.up.copy(p.up); });
}
function close() {
  if (mode === 'orbit') return; panel.classList.remove('on'); tour.classList.remove('on'); document.body.classList.remove('focus'); viewOffTarget = 0; focus = null; cur = -1;
  flyTo(orbitPose(camera.position.clone().normalize(), overview), 1.4, toOrbit);
}
function toOrbit() { camera.up.set(0, 1, 0); mode = 'orbit'; controls.enabled = true; controls.update(); lastTouch = performance.now(); }
function visit(k) { const D = DISTRICTS[k]; if (mode !== 'orbit') { panel.classList.remove('on'); tour.classList.remove('on'); document.body.classList.remove('focus'); viewOffTarget = 0; focus = null; cur = -1; }
  controls.autoRotate = false; flyTo(orbitPose(dirOf(D.lat - 9, D.lon), 2.75), 1.5, toOrbit); }

/* ───────────────────────── DOM ───────────────────────── */
const $ = id => document.getElementById(id), panel = $('panel'), tour = $('tour'), indexEl = $('index'), labels = $('labels');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function fillPanel(p) {
  panel.style.setProperty('--c', p.D.color); $('pChip').textContent = p.D.name; $('pCoord').textContent = coord(...p.at);
  $('pBody').innerHTML = `<h2>${esc(p.name)}</h2><p class="kind mono">${esc(p.kind)}</p>${p.img ? `<img src="${p.img}" alt="">` : ''}<p class="head">${esc(p.head)}</p>${p.txt ? `<p class="txt">${esc(p.txt)}</p>` : ''}`
    + (p.facts ? `<ul class="facts">${p.facts.map(([a, b]) => `<li><span class="mono">${esc(a)}</span><span>${esc(b)}</span></li>`).join('')}</ul>` : '')
    + (p.stack ? `<div class="stack mono">${p.stack.map(s => `<span>${esc(s)}</span>`).join('')}</div>` : '');
  $('pBody').scrollTop = 0; $('pStatus').textContent = p.status || '';
  const a = $('pLink'); if (p.link) { a.style.display = ''; a.textContent = p.link[0] + ' ↗'; a.href = p.link[1]; } else a.style.display = 'none';
  $('tWhere').textContent = `${String(cur + 1).padStart(2, '0')} / ${order.length} · ${p.name}`;
  $('tTicks').innerHTML = order.map((id, i) => `<i class="${i <= cur ? 'done' : ''}" style="--c:${LM[id].D.color}"></i>`).join('');
}
const mk = (cls, color, name, sub, onclick) => { const b = document.createElement('button'); b.className = 'lm ' + cls; b.style.setProperty('--c', color); b.innerHTML = `<span class="stem"></span><span class="tx"><b>${esc(name)}</b><em>${esc(sub)}</em></span><span class="pin"></span>`; b.onclick = onclick; labels.append(b); return b; };
for (const p of PLACES) p.el = mk('', p.D.color, p.name, p.kind, () => open(p.id));
for (const k in DISTRICTS) { const D = DISTRICTS[k]; D.anchor = D.dir.clone().multiplyScalar(1.1); D.el = mk('district', D.color, D.name, `${String(D.places.length).padStart(2, '0')} places · ${D.blurb}`, () => visit(k)); }

$('legend').innerHTML = Object.values(DISTRICTS).map(D => `<li><button data-d="${D.id}" style="--c:${D.color}"><span class="sw"></span><span class="nm">${D.name}</span><span class="ct mono">${String(D.places.length).padStart(2, '0')} · ${D.blurb}</span></button></li>`).join('');
$('legend').onclick = e => { const b = e.target.closest('button'); if (b) visit(b.dataset.d); };
indexEl.innerHTML = `<div class="mono" style="color:var(--muted)">Index · every place on the planet</div>` + Object.values(DISTRICTS).map(D => `<h3 style="--c:${D.color}"><i></i>${D.name}</h3><ol>${D.places.map(p => `<li><button data-id="${p.id}"><span class="mono">${String(order.indexOf(p.id) + 1).padStart(2, '0')}</span>${esc(p.name)}</button></li>`).join('')}</ol>`).join('');
indexEl.onclick = e => { const b = e.target.closest('button'); if (b) open(b.dataset.id); };
$('btnIndex').onclick = () => indexEl.classList.toggle('on');
$('btnTour').onclick = () => open(order[0]);
$('tNext').onclick = () => open(order[(cur + 1) % order.length]);
$('tPrev').onclick = () => open(order[(cur - 1 + order.length) % order.length]);
$('pClose').onclick = close;
const GREET = { morning: 'Morning.', afternoon: 'Afternoon.', evening: 'Evening.', late: 'Up late? So am I.' };
const bandOf = h => h < 5 || h >= 22 ? 'late' : h < 12 ? 'morning' : h < 17 ? 'afternoon' : 'evening';
/* every colour the world uses, per time of day. The frame loop eases from one set to the next. */
const LOOKS = {
  morning:   { top: '#74BEFF', mid: '#C4E6FF', bot: '#FFE4C6', sunCol: '#FFE2A8', sunK: 1, moonK: 0, star: 0, shade: '#A9B9F2', lit: '#FFFAEF', rim: '#FFF1DA', rimK: .5, atmo: '#E2F3FF', cloudLit: '#FFFFFF', cloudShade: '#B4C9F5', deep: '#2360D8', sea: '#3A8CF2', shallow: '#74DCEC', glint: '#FFF4D2', sunY: .74, glow: 1, city: '#000000' },
  afternoon: { top: '#3A92FA', mid: '#86C9FF', bot: '#DDF3FF', sunCol: '#FFF4D0', sunK: 1, moonK: 0, star: 0, shade: '#9CB0F4', lit: '#FFFFFF', rim: '#D2ECFF', rimK: .5, atmo: '#C4E8FF', cloudLit: '#FFFFFF', cloudShade: '#A6C2F3', deep: '#1D58CF', sea: '#2E82F2', shallow: '#5FD6EE', glint: '#FFFFFF', sunY: .8, glow: 1, city: '#000000' },
  evening:   { top: '#7C88EA', mid: '#F4A3BA', bot: '#FFD59C', sunCol: '#FFB06A', sunK: 1.1, moonK: 0, star: .25, shade: '#8C7BD0', lit: '#FFDCC0', rim: '#FFC2A0', rimK: .75, atmo: '#FFC9BC', cloudLit: '#FFDFC8', cloudShade: '#A183C8', deep: '#3344AE', sea: '#5C6FD8', shallow: '#F0A6C0', glint: '#FFD9A8', sunY: .58, glow: 1.5, city: '#3A2A0A' },
  night:     { top: '#04071A', mid: '#0D1340', bot: '#252F78', sunCol: '#000000', sunK: 0, moonK: 1, star: 1, shade: '#39428F', lit: '#97A8F5', rim: '#7F9BFF', rimK: .65, atmo: '#5B78FF', cloudLit: '#6272B4', cloudShade: '#151B42', deep: '#0A1C66', sea: '#12308F', shallow: '#2A5CC4', glint: '#BFD0FF', sunY: .8, glow: 2.3, city: '#8A6A22' },
};
const COLS = ['top', 'mid', 'bot', 'sunCol', 'shade', 'lit', 'rim', 'atmo', 'cloudLit', 'cloudShade', 'deep', 'sea', 'shallow', 'glint', 'city'], NUMS = ['sunK', 'moonK', 'star', 'rimK', 'sunY', 'glow'];
const now = {}; let goal, band, theme;
function updateLook(dt) {
  const k = now.top ? 1 - Math.exp(-dt * 2.4) : 1;
  for (const c of COLS) { now[c] ||= new THREE.Color(goal[c]); now[c].lerp(goal[c], k); }
  for (const n of NUMS) now[n] = now[n] === undefined ? goal[n] : lerp(now[n], goal[n], k);
  skyU.uTop.value.copy(now.top); skyU.uMid.value.copy(now.mid); skyU.uBot.value.copy(now.bot); skyU.uSunCol.value.copy(now.sunCol); skyU.uSunK.value = now.sunK; skyU.uMoonK.value = now.moonK;
  skyU.uSun.value.set(lerp(skyU.uSun.value.x, document.body.classList.contains('focus') && W > 820 ? .56 : .8, k), now.sunY);
  amb.color.copy(now.shade); sun.color.setRGB(Math.max(0, now.lit.r - now.shade.r), Math.max(0, now.lit.g - now.shade.g), Math.max(0, now.lit.b - now.shade.b));
  seaU.uShade.value.copy(now.shade); seaU.uKey.value.copy(sun.color); seaU.uDeep.value.copy(now.deep); seaU.uMid.value.copy(now.sea); seaU.uShallow.value.copy(now.shallow); seaU.uGlint.value.copy(now.glint);
  RIM.value.copy(now.rim); RIMK.value = now.rimK; atmoU.uCol.value.copy(now.atmo); cloudU.uLit.value.copy(now.cloudLit); cloudU.uShade.value.copy(now.cloudShade);
  starU.uK.value = now.star; constMat.opacity = now.star * .6; cityMat.emissive.copy(now.city); beamMat.opacity = .3 + now.star * .3;
  for (const m of GLOW) m.color.copy(m.userData.base).multiplyScalar(now.glow);
}
function setTheme(next) {
  theme = next; const night = theme === 'night';
  document.documentElement.dataset.theme = theme; goal = {}; const L = LOOKS[night ? 'night' : band === 'late' ? 'afternoon' : band];
  for (const c of COLS) goal[c] = new THREE.Color(L[c]); for (const n of NUMS) goal[n] = L[n];
  $('btnTheme').textContent = night ? '☀ Day' : '☾ Night';
}
// the sky follows the visitor's own clock on arrival; the button overrides it
function setHour(h) { band = bandOf(h); $('greet').textContent = GREET[band] + ' Come have a look around.'; setTheme(h >= 19 || h < 6 ? 'night' : 'day'); }
setHour(new Date().getHours());
$('btnTheme').onclick = () => setTheme(theme === 'night' ? 'day' : 'night');
$('pv').onclick = e => { if (e.target.dataset.h) setHour(+e.target.dataset.h); };
for (const c of CONST) c.el = mk('const', '#fff', c.name, '', null);
let shootAt = 3;
tick.push((t, dt) => {
  if (skyU.uShootT.value < 1.2) skyU.uShootT.value += dt / .9;
  else if (theme === 'night' && t > shootAt) { const left = Math.random() > .5; skyU.uShoot.value.set(.1 + Math.random() * .8, .55 + Math.random() * .4, left ? -1 : 1, -.25 - Math.random() * .4); skyU.uShootT.value = 0; shootAt = t + 2.5 + Math.random() * 4.5; }
});
addEventListener('keydown', e => { if (e.key === 'Escape') { indexEl.classList.remove('on'); close(); } if (cur >= 0 && e.key === 'ArrowRight') $('tNext').click(); if (cur >= 0 && e.key === 'ArrowLeft') $('tPrev').click(); });
$('plate').textContent = `Plate 01 · ${Object.keys(DISTRICTS).length} districts · ${PLACES.length} places`;

/* pointer: click to visit, drag to circle a place while focused */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), globe = new THREE.Sphere(new V3(), 1.0), tmp = new V3();
let down = null, hot = null;
function pick(e) { ndc.set(e.clientX / W * 2 - 1, -(e.clientY / Hh) * 2 + 1); ray.setFromCamera(ndc, camera); const h = ray.intersectObjects(hits, false)[0]; if (!h) return null; const g = ray.ray.intersectSphere(globe, tmp); return g && ray.ray.origin.distanceTo(g) < h.distance - .08 ? null : h.object.userData.id; }
canvas.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, az: focus ? focus.az : 0 }; });
addEventListener('pointerup', e => { if (down && Math.hypot(e.clientX - down.x, e.clientY - down.y) < 6 && e.target === canvas && mode !== 'fly') { const id = pick(e); if (id) open(id); } down = null; });
canvas.addEventListener('pointermove', e => {
  if (down && mode === 'focus') { focus.az = down.az - (e.clientX - down.x) * .006; const ps = focusPose(focus.p, focus.az); camera.position.copy(ps.pos); camera.quaternion.copy(ps.quat); return; }
  if (down || mode === 'fly') return; const id = pick(e); if (id !== hot) { if (hot) LM[hot].el.classList.remove('hot'); hot = id; if (hot) LM[hot].el.classList.add('hot'); canvas.classList.toggle('point', !!hot); }
});
canvas.addEventListener('wheel', e => { if (mode === 'focus' && e.deltaY > 0) close(); }, { passive: true });

/* ───────────────────────── frame loop ───────────────────────── */
const proj = new V3(), camDir = new V3(), seg = new V3();
function place(el, a, show) {
  let vis = show;
  if (vis) { seg.copy(a).sub(camera.position); const t = clamp(-camera.position.dot(seg) / seg.lengthSq(), 0, 1); vis = tmp.copy(camera.position).addScaledVector(seg, t).length() > .992; }
  if (vis) { proj.copy(a).project(camera); vis = proj.z < 1 && Math.abs(proj.x) < 1.05 && Math.abs(proj.y) < 1.05; if (vis) el.style.transform = `translate3d(${((proj.x * .5 + .5) * W).toFixed(1)}px,${((-proj.y * .5 + .5) * Hh).toFixed(1)}px,0)`; }
  el.classList.toggle('on', vis);
}
const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  for (const f of tick) f(t, dt);
  if (mode === 'fly') stepFly(dt);
  else if (mode === 'orbit') { if (!controls.autoRotate && performance.now() - lastTouch > 9000) controls.autoRotate = true; controls.update(); }
  if (Math.abs(viewOff - viewOffTarget) > .5) { viewOff = lerp(viewOff, viewOffTarget, 1 - Math.pow(.002, dt)); applyOffset(); }
  updateLook(dt);
  composer.render();

  const dist = camera.position.length(), near = mode !== 'orbit' || dist < 3.25;
  labels.classList.toggle('flying', mode === 'fly');
  for (const p of PLACES) { p.el.classList.toggle('dot', !near); place(p.el, p.anchor, !(focus && focus.p === p)); }
  for (const k in DISTRICTS) place(DISTRICTS[k].el, DISTRICTS[k].anchor, !near);
  for (const c of CONST) place(c.el, c.anchor, theme === 'night');
  camDir.copy(camera.position).normalize();
  $('view').textContent = `View ${coord(Math.asin(camDir.y) / D2R, Math.atan2(-camDir.z, camDir.x) / D2R)} · ${(overview / dist).toFixed(1)}×`;
  requestAnimationFrame(frame);
}
window.__look = (lat, lon) => { controls.autoRotate = false; lastTouch = 1e15; camera.position.copy(dirOf(lat, lon)).multiplyScalar(overview); controls.update(); };
frame();
</script>
